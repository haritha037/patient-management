server:
  port: 4004

auth:
  service:
    url: http://auth-service:4005

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:4005  # internal address
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

          # REST CLIENT -> http://localhost:4004/auth/login
          # API GATEWAY -> http://auth-service:4005/login


        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

          # REST CLIENT -> http://localhost:4004/api/patients

          # This request will land in the API Gateway
          # Api gateway uses these routes to determine what to do with it
          # The request matches with /api/patients/** predicate
          # Gateway applies the filter and redirect the request to patient service's uri

          # API GATEWAY -> http://patient-service:4000/patients
          # PATIENT SERVICE (SPRING BOOT APP) -> /patients -> Patients array

        - id: api-docs-patient-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

          # REST-CLIENT -> http://localhost:4004/api-docs/patients
          # API GATEWAY -> http://patient-service:4000/v3/api-docs


        - id: api-docs-auth-route
          uri: http://auth-service:4005
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs

          # REST-CLIENT -> http://localhost:4004/api-docs/auth
          # API GATEWAY -> http://auth-service:4005/v3/api-docs